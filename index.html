<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rànquing de Pàdel de Pujalt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estil.css">
</head>
<body>
  <!-- Icones SVG senzilles (sprite). S'usen amb <use href="#i-...">. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-raqueta" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="9.5" cy="9.5" rx="6.5" ry="7.5" transform="rotate(-45 9.5 9.5)"/>
          <path d="M14.5 14.5 L20.5 20.5"/>
          <path d="M6.5 8.5h.01M9.5 6.5h.01M9.5 10.5h.01M12.5 8.5h.01M6.5 12.5h.01M12.5 12.5h.01M9.5 14.5h.01" stroke-width="2.2"/>
        </g>
      </symbol>
      <symbol id="i-pilota" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" fill="#d4e157" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4.2 6.5c3.6 2.2 5.4 5 5.4 8.3 0 1.9-.6 3.6-1.6 5M19.8 17.5c-3.6-2.2-5.4-5-5.4-8.3 0-1.9.6-3.6 1.6-5"
              fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-calendari" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
          <path d="M3.5 10h17M8 3v4M16 3v4"/>
          <path d="M8 14h.01M12 14h.01M16 14h.01M8 17.2h.01M12 17.2h.01" stroke-width="2.2"/>
        </g>
      </symbol>
      <symbol id="i-trofeu" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 3.5h9v6a4.5 4.5 0 0 1-9 0z"/>
          <path d="M7.5 5.5H4.5v1.5a3 3 0 0 0 3 3M16.5 5.5h3v1.5a3 3 0 0 1-3 3"/>
          <path d="M12 14v3.5M8.5 20.5h7M9.5 20.5l.5-3h4l.5 3"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <header class="capcalera">
    <div class="capcalera-interior">
      <h1>
        <svg class="icona icona-gran" aria-hidden="true"><use href="#i-raqueta"/></svg>
        Rànquing de Pàdel <span class="poble">de Pujalt</span>
        <svg class="icona icona-gran" aria-hidden="true"><use href="#i-pilota"/></svg>
      </h1>
      <nav aria-label="Seccions">
        <a href="#classificacio"><svg class="icona" aria-hidden="true"><use href="#i-trofeu"/></svg>Classificació</a>
        <a href="#resultats"><svg class="icona" aria-hidden="true"><use href="#i-raqueta"/></svg>Resultats</a>
        <a href="#proxims"><svg class="icona" aria-hidden="true"><use href="#i-calendari"/></svg>Pròxims partits</a>
        <a href="#disponibilitat"><svg class="icona" aria-hidden="true"><use href="#i-pilota"/></svg>Disponibilitat</a>
      </nav>
      <p class="reserva-capcalera">
        <a class="boto-reserva" href="https://domo.iuttersystem.com/pujalt/login" target="_blank" rel="noopener noreferrer"><svg class="icona" aria-hidden="true"><use href="#i-raqueta"/></svg>Reserva la pista</a>
      </p>
      <p id="darrera-actualitzacio"></p>
    </div>
  </header>

  <main>
    <section id="classificacio">
      <h2><svg class="icona" aria-hidden="true"><use href="#i-trofeu"/></svg>Classificació</h2>
      <div class="contingut">Carregant…</div>
    </section>

    <section id="resultats">
      <h2><svg class="icona" aria-hidden="true"><use href="#i-raqueta"/></svg>Resultats</h2>
      <div class="contingut">Carregant…</div>
    </section>

    <section id="proxims">
      <h2><svg class="icona" aria-hidden="true"><use href="#i-calendari"/></svg>Pròxims partits</h2>
      <div class="contingut">Carregant…</div>
    </section>

    <section id="disponibilitat">
      <h2><svg class="icona" aria-hidden="true"><use href="#i-pilota"/></svg>Disponibilitat de pista</h2>
      <div class="contingut">Carregant…</div>
      <!-- Fora de .contingut perquè el refresc de dades no l'esborri -->
      <div class="reserva-pista">
        <p>Per reservar, entra a la plataforma de la pista</p>
        <a class="boto-reserva" href="https://domo.iuttersystem.com/pujalt/login" target="_blank" rel="noopener noreferrer"><svg class="icona" aria-hidden="true"><use href="#i-raqueta"/></svg>Reserva la pista</a>
      </div>
    </section>
  </main>

  <!-- Ordre important: config i dades primer, app al final -->
  <script src="js/config.js"></script>
  <script src="js/dades.js"></script>
  <script src="js/classificacio.js"></script>
  <script src="js/vistes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
